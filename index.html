<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#B5432E"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="El Gordo Stock"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>
  :root {

    --front: #4F7A4F;

    --white: #FFFFFF;
  }

  * { box-sizing: border-box; }

  #app {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    max-width: 480px;
    margin: 0 auto;
    padding: 0 0 40px 0;
    min-height: 100vh;
  }

  .receipt-head {
    text-align: center;
    padding: 22px 16px 16px;
    border-bottom: 2px dashed var(--line);
    position: relative;
  }
  .receipt-head .eyebrow {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  .receipt-head h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-size: 28px;
    margin: 4px 0 2px;
    letter-spacing: 0.5px;
  }
  .receipt-head .sub {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .restaurant-toggle {
    display: flex;
    margin: 16px;
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    overflow: hidden;
  }
  .restaurant-toggle button {
    flex: 1;
    padding: 12px 6px;
    border: none;
    background: var(--white);
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.5px;
    color: var(--ink);
    cursor: pointer;
  }
  .restaurant-toggle button.active {
    background: var(--stamp);
    color: var(--white);
  }
  .restaurant-toggle button:first-child { border-right: 1.5px solid var(--ink); }

  .tabs {
    display: flex;
    margin: 0 16px 12px;
    gap: 6px;
  }
  .tabs button {
    flex: 1;
    padding: 9px 4px;
    border: 1px solid var(--line);
    background: var(--white);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tabs button.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .card {
    background: var(--white);
    margin: 0 16px 16px;
    border-radius: 10px;
    padding: 16px;
    border: 1px solid var(--line);
  }

  .cat-pills {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .cat-pill {
    flex: 1;
    padding: 10px 4px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    text-align: center;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .cat-pill.active[data-cat="Kitchen"] { background: var(--kitchen); border-color: var(--kitchen); color: white; box-shadow: 0 0 0 2px rgba(161,90,52,.18); transform: translateY(-1px); }
  .cat-pill.active[data-cat="Back"] { background: var(--back); border-color: var(--back); color: white; box-shadow: 0 0 0 2px rgba(61,107,140,.18); transform: translateY(-1px); }
  .cat-pill.active[data-cat="Front"] { background: var(--front); border-color: var(--front); color: white; box-shadow: 0 0 0 2px rgba(79,122,79,.18); transform: translateY(-1px); }
  .cat-pill { transition: background .15s ease, color .15s ease, border-color .15s ease, transform .15s ease, box-shadow .15s ease; }
  .cat-pill.active::after { content: " ✓"; font-weight: 800; }

  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--line);
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
    background: var(--paper);
    color: var(--ink);
  }
  .field input:focus { outline: 2px solid var(--stamp); outline-offset: 1px; }

  .row-2 { display: flex; gap: 10px; }
  .row-2 .field { flex: 1; }

  .add-btn {
    width: 100%;
    padding: 13px;
    background: var(--stamp);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14.5px;
    letter-spacing: 0.5px;
    cursor: pointer;
    margin-top: 4px;
  }
  .add-btn:active { opacity: 0.85; }
  .add-btn:disabled { background: var(--line); color: var(--ink-soft); }

  .section-label {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin: 0 20px 8px;
  }

  .log-entry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px dashed var(--line);
  }
  .log-entry:last-child { border-bottom: none; }
  .log-entry .dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block; margin-right: 8px; flex-shrink: 0;
  }
  .log-entry .info { display: flex; align-items: center; min-width: 0; }
  .log-entry .text { min-width: 0; }
  .log-entry .item-name { font-weight: 700; font-size: 13.5px; }
  .log-entry .meta { font-size: 11px; color: var(--ink-soft); font-family: 'Courier New', monospace; }
  .log-entry .amount {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 13.5px;
    white-space: nowrap;
    margin-left: 8px;
  }
  .log-entry .del {
    background: none; border: none; color: var(--ink-soft);
    font-size: 16px; margin-left: 8px; cursor: pointer; padding: 2px 6px;
  }

  .empty-note {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 24px 12px;
    font-style: italic;
  }

  .month-picker {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .month-picker button {
    background: var(--paper-dark);
    border: 1px solid var(--line);
    border-radius: 6px;
    width: 32px; height: 32px;
    font-size: 16px;
    cursor: pointer;
    color: var(--ink);
  }
  .month-picker .label {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
  }

  .summary-cat-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 16px 0 6px;
  }
  .summary-cat-header .bar { width: 4px; height: 14px; border-radius: 2px; }
  .summary-cat-header span {
    font-size: 12px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--ink-soft);
  }

  table.summary-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 4px;
  }
  table.summary-table th {
    text-align: left;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
    padding: 4px 2px;
    border-bottom: 1px solid var(--line);
  }
  table.summary-table th:not(:first-child), table.summary-table td:not(:first-child) {
    text-align: right;
  }
  table.summary-table td {
    padding: 7px 2px;
    font-size: 13px;
    border-bottom: 1px dashed var(--line);
  }
  table.summary-table td.item-cell { font-weight: 600; }
  table.summary-table td.num-cell { font-family: 'Courier New', monospace; }

  .grand-total {
    display: flex;
    justify-content: space-between;
    padding-top: 12px;
    margin-top: 4px;
    border-top: 2px solid var(--ink);
    font-weight: 700;
    font-size: 15px;
  }
  .grand-total .val { font-family: 'Courier New', monospace; }

  .cat-subtotal {
    display: flex;
    justify-content: space-between;
    padding: 6px 10px;
    margin: 6px 0 18px;
    background: var(--paper-dark);
    border-radius: 0 6px 6px 0;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
  }
  .cat-subtotal .val { font-family: 'Courier New', monospace; }


  .shopping-add-btn {
    width: 100%;
    border: 0;
    border-radius: 8px;
    padding: 12px 14px;
    background: var(--stamp);
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
  }
  .shopping-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .shopping-actions button {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 8px;
    background: var(--white);
    color: var(--ink);
    font-weight: 700;
    cursor: pointer;
  }
  .shopping-actions .primary {
    background: var(--ink);
    color: var(--white);
    border-color: var(--ink);
  }
  .week-picker {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }
  .week-picker button {
    border:1px solid var(--line);
    background:var(--white);
    border-radius:7px;
    width:38px;
    height:34px;
    font-size:20px;
    cursor:pointer;
  }
  .week-picker .label {
    flex:1;
    text-align:center;
    font-weight:800;
    font-size:13px;
  }
  .shopping-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:10px 0;
    border-bottom:1px dashed var(--line);
  }
  .shopping-row:last-child { border-bottom:0; }
  .shopping-row .info { display:flex; align-items:center; min-width:0; }
  .shopping-row .text { min-width:0; }
  .shopping-row .item-name { font-weight:700; font-size:13px; }
  .shopping-row .meta { font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .shopping-row .qty { font-family:'Courier New',monospace; font-weight:800; white-space:nowrap; }
  .shopping-row .remove-list {
    border:0; background:transparent; color:var(--ink-soft); padding:5px; font-size:15px; cursor:pointer;
  }
  .shopping-empty { text-align:center; padding:18px 8px; color:var(--ink-soft); font-size:12px; }

  .footer-note {
    text-align: center;
    font-size: 10.5px;
    color: var(--ink-soft);
    padding: 10px 24px 0;
    font-family: 'Courier New', monospace;
  }

  .loading { text-align: center; padding: 30px; color: var(--ink-soft); font-size: 13px; }

  /* Enhanced management UI */
  .auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--paper)}
  .auth-card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 8px 30px rgba(42,36,32,.08)}
  .auth-logo{width:76px;height:76px;object-fit:contain;border-radius:18px;display:block;margin:0 auto 12px}
  .auth-card h2{text-align:center;font-family:Georgia,serif;margin:6px 0 4px}
  .auth-card .hint{text-align:center;color:var(--ink-soft);font-size:12px;margin:0 0 18px}
  .auth-error{background:#fff0ed;color:#9b2f1d;border:1px solid #e8b2a7;padding:10px;border-radius:8px;font-size:12px;margin-bottom:12px;display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 0}
  .user-badge{font-size:10px;color:var(--ink-soft);font-family:'Courier New',monospace;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icon-btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 9px;cursor:pointer}
  .dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
  .stat .label{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.7px}
  .stat .value{font-family:'Courier New',monospace;font-weight:800;font-size:20px;margin-top:4px}
  .alert-card{margin:0 16px 16px;background:#fff8e7;border:1px solid #ead7a4;border-radius:10px;padding:12px;font-size:12px}
  .progress{height:8px;background:var(--paper-dark);border-radius:99px;overflow:hidden;margin-top:8px}
  .progress span{display:block;height:100%;background:var(--stamp)}
  .role-pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 7px;font-size:9px;text-transform:uppercase;letter-spacing:.6px}
  .admin-only{display:none}
  .mini-btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 10px;font-weight:700;font-size:11px;cursor:pointer}
  .danger{color:#9b2f1d;border-color:#e1b0a5}
  .product-row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
  .product-row:last-child{border-bottom:0}
  .stock-low{color:#a43b26;font-weight:800}
  .stock-ok{color:#4f7a4f;font-weight:800}
  .audit-row{padding:9px 0;border-bottom:1px dashed var(--line);font-size:11px}
  .audit-row:last-child{border-bottom:0}
  .bar-row{display:grid;grid-template-columns:78px 1fr 70px;align-items:center;gap:8px;margin:7px 0;font-size:11px}
  .bar-track{height:9px;background:var(--paper-dark);border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;background:var(--stamp)}
  @media (max-width:360px){.dashboard-grid{grid-template-columns:1fr}.tabs button{font-size:10px}}
</style></head><body>
<div id="auth" class="auth-screen">
  <div class="auth-card">
    <img class="auth-logo" src="logo.png" onerror="this.style.display='none'">
    <h2>El Gordo Stock</h2>
    <p class="hint">Secure restaurant management</p>
    <div id="auth-error" class="auth-error"></div>
    <div class="field"><label>Email</label><input id="auth-email" type="email" autocomplete="username" placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input id="auth-password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button id="auth-signin" class="add-btn">Sign in</button>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="receipt-head">
    <div class="eyebrow">★ Stock Tracker ★</div>
    <h1>El Gordo</h1>
    <div class="sub">purchase log &amp; monthly recap</div>
  </div>
  <div class="topbar">
    <div><span id="user-email" class="user-badge"></span> <span id="role-pill" class="role-pill"></span></div>
    <button id="signout" class="icon-btn">↪ Sign out</button>
  </div>
  <div class="restaurant-toggle">
    <button id="btn-union" class="active">UNION NJ</button>
    <button id="btn-jersey">JERSEY CITY</button>
  </div>
  <div class="tabs">
    <button id="tab-dashboard" class="active">Dashboard</button>
    <button id="tab-log">Log purchase</button>
    <button id="tab-list">Shopping list</button>
    <button id="tab-summary">Recap</button>
    <button id="tab-admin" class="admin-only">Admin</button>
  </div>
  <div id="view-dashboard"></div>
  <div id="view-log" style="display:none;"></div>
  <div id="view-list" style="display:none;"></div>
  <div id="view-summary" style="display:none;"></div>
  <div id="view-admin" style="display:none;"></div>
  <div class="footer-note">shared online • secure accounts • changes sync between phones</div>
</div>

<script>
(function(){
  const CATEGORIES=['Kitchen','Back','Front'];
  const CAT_COLOR={Kitchen:'#A15A34',Back:'#3D6B8C',Front:'#4F7A4F'};
  const RESTAURANTS={union:'El Gordo Union NJ',jersey:'El Gordo Jersey City'};
  const SUPABASE_URL='https://suidbjuzmuorfatgjppu.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY='sb_publishable_AnO5X-rlrLVlBHcIxsiH7A_dlikRUQI';
  const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const $=id=>document.getElementById(id);
  let user=null, profile=null;
  let state={restaurant:'union',tab:'dashboard',category:'Kitchen',listCategory:'Kitchen',listWeek:getMondayISO(new Date()),summaryMonth:new Date().toISOString().slice(0,7),entries:[],shoppingItems:[],products:[],audit:[]};

  function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function money(n){return '$'+(Math.round(Number(n||0)*100)/100).toFixed(2)}
  function qty(n){return (Math.round(Number(n||0)*100)/100).toString()}
  function today(){return new Date().toISOString().slice(0,10)}
  function monday(d){d=new Date(d);d.setHours(12,0,0,0);let day=d.getDay();d.setDate(d.getDate()+(day===0?-6:1-day));return d.toISOString().slice(0,10)}
  function getMondayISO(d){return monday(d)}
  function shiftWeek(i,n){let d=new Date(i+'T12:00:00');d.setDate(d.getDate()+7*n);return d.toISOString().slice(0,10)}
  function weekLabel(i){let s=new Date(i+'T12:00:00'),e=new Date(s);e.setDate(e.getDate()+6);return `${s.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${e.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`}
  function monthLabel(ym){let [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}
  function shiftMonth(ym,n){let [y,m]=ym.split('-').map(Number);m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}return `${y}-${String(m).padStart(2,'0')}`}
  function isAdmin(){return profile?.role==='admin'}
  function canEdit(){return ['admin','manager','employee'].includes(profile?.role)}
  function canManage(){return ['admin','manager'].includes(profile?.role)}

  async function audit(action,entity,details={}){
    try{await db.from('audit_logs').insert({user_id:user.id,user_email:user.email,action,entity,details})}catch(e){console.warn('audit',e)}
  }
  async function loadEntries(){
    const {data,error}=await db.from('purchases').select('*').order('date',{ascending:false}).order('created_at',{ascending:false});
    if(error){console.error(error);return}
    state.entries=(data||[]).map(e=>({...e,qty:Number(e.qty),price:Number(e.price)}));
  }
  async function loadShopping(){
    const {data,error}=await db.from('shopping_list').select('*').eq('restaurant',state.restaurant).eq('week_start',state.listWeek).order('category').order('created_at');
    if(!error) state.shoppingItems=data||[];
  }
  async function loadProducts(){
    const {data,error}=await db.from('inventory').select('*').eq('restaurant',state.restaurant).order('item');
    state.products=error?[]:data||[];
  }
  async function loadProfiles(){
    const {data,error}=await db.from('profiles').select('*').order('email');
    return error?[]:(data||[]);
  }
  async function updateRole(id,role){
    const {error}=await db.from('profiles').update({role}).eq('id',id);
    if(error)return alert(error.message);
    await audit('role_change','profile',{id,role});
    await renderAdmin();
  }
  async function loadAudit(){
    const {data,error}=await db.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(100);
    state.audit=error?[]:data||[];
  }

  function renderNav(){
    ['dashboard','log','list','summary','admin'].forEach(t=>{let b=$('tab-'+t);if(b)b.classList.toggle('active',state.tab===t)});
    $('view-dashboard').style.display=state.tab==='dashboard'?'block':'none';
    $('view-log').style.display=state.tab==='log'?'block':'none';
    $('view-list').style.display=state.tab==='list'?'block':'none';
    $('view-summary').style.display=state.tab==='summary'?'block':'none';
    $('view-admin').style.display=state.tab==='admin'?'block':'none';
    $('btn-union').classList.toggle('active',state.restaurant==='union');
    $('btn-jersey').classList.toggle('active',state.restaurant==='jersey');
    $('tab-admin').style.display=isAdmin()?'block':'none';
  }

  async function renderDashboard(){
    await loadProducts();
    const week=monday(new Date()), weekEntries=state.entries.filter(e=>e.restaurant===state.restaurant && e.date>=week);
    const spend=weekEntries.reduce((s,e)=>s+e.qty*e.price,0);
    const low=state.products.filter(p=>Number(p.current_qty)<Number(p.min_qty));
    const pending=state.shoppingItems.length;
    const catTotals=CATEGORIES.map(c=>({c,total:weekEntries.filter(e=>e.category===c).reduce((s,e)=>s+e.qty*e.price,0)}));
    const max=Math.max(...catTotals.map(x=>x.total),1);
    $('view-dashboard').innerHTML=`
      <div class="dashboard-grid">
        <div class="stat"><div class="label">This week</div><div class="value">${money(spend)}</div></div>
        <div class="stat"><div class="label">Shopping items</div><div class="value">${pending}</div></div>
        <div class="stat"><div class="label">Low stock</div><div class="value">${low.length}</div></div>
        <div class="stat"><div class="label">Purchases</div><div class="value">${weekEntries.length}</div></div>
      </div>
      ${low.length?`<div class="alert-card"><strong>⚠️ Low stock</strong><div style="margin-top:6px">${low.slice(0,8).map(p=>`• ${esc(p.item)} — ${qty(p.current_qty)} ${esc(p.unit)} / min ${qty(p.min_qty)}`).join('<br>')}</div><button class="mini-btn" id="generate-smart" style="margin-top:10px">✨ Generate shopping list</button></div>`:''}
      <div class="card"><div class="section-label" style="margin:0 0 8px">This week by area</div>
        ${catTotals.map(x=>`<div class="bar-row"><span>${x.c}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(x.total/max*100)}%;background:${CAT_COLOR[x.c]}"></div></div><b>${money(x.total)}</b></div>`).join('')}
      </div>
      <div class="alert-card" style="background:#fff;border-color:var(--line)">
        <strong>📅 Weekly order reminder</strong>
        <div style="margin-top:5px;color:var(--ink-soft)">Use this reminder when you prepare the weekly order for your patronne.</div>
        <button class="mini-btn" id="reminder-btn" style="margin-top:9px">Enable reminder</button>
      </div>
      <div class="card">
        <div style="font-weight:800;margin-bottom:8px">Quick actions</div>
        <div class="shopping-actions">
          <button id="dash-log">➕ Purchase</button><button id="dash-list" class="primary">🛒 Shopping list</button>
        </div>
        <div class="shopping-actions">
          <button id="dash-report">📄 Report / PDF</button><button id="dash-backup">💾 Backup data</button>
        </div>
      </div>`;
    $('dash-log').onclick=()=>{state.tab='log';renderAll()};
    $('dash-list').onclick=()=>{state.tab='list';renderAll()};
    $('dash-report').onclick=exportReport;
    $('dash-backup').onclick=exportBackup;
    const g=$('generate-smart'); if(g)g.onclick=generateSmartList;
    const rb=$('reminder-btn');
    if(rb){
      rb.textContent=localStorage.getItem('elgordo_weekly_reminder')==='1'?'✓ Reminder enabled':'Enable reminder';
      rb.onclick=()=>{localStorage.setItem('elgordo_weekly_reminder','1');rb.textContent='✓ Reminder enabled';alert('Reminder enabled on this device. Open the app on your weekly order day to see the reminder.');};
    }
  }

  function catPills(selected,attr){return CATEGORIES.map(c=>`<div class="cat-pill ${c===selected?'active':''}" data-${attr}="${c}">${c}</div>`).join('')}

  function renderLog(){
    const entries=state.entries.filter(e=>e.restaurant===state.restaurant).slice(0,40);
    $('view-log').innerHTML=`<div class="card"><div class="cat-pills">${catPills(state.category,'cat')}</div>
      <div class="field"><label>Item</label><input id="f-item" placeholder="e.g. Whole chicken"></div>
      <div class="row-2"><div class="field"><label>Quantity</label><input id="f-qty" type="number" inputmode="decimal"></div><div class="field"><label>Unit</label><input id="f-unit" placeholder="kg, pack..."></div></div>
      <div class="row-2"><div class="field"><label>Unit price ($)</label><input id="f-price" type="number" step="0.01" inputmode="decimal"></div><div class="field"><label>Date</label><input id="f-date" type="date" value="${today()}"></div></div>
      <button class="add-btn" id="f-add">Add to log</button></div>
      <div class="section-label">Recent — ${RESTAURANTS[state.restaurant]}</div>
      <div class="card" style="padding:6px 16px">${entries.length?entries.map(e=>`<div class="log-entry"><div class="info"><span class="dot" style="background:${CAT_COLOR[e.category]}"></span><div class="text"><div class="item-name">${esc(e.item)}</div><div class="meta">${e.date} · ${qty(e.qty)} ${esc(e.unit)} · ${e.category}</div></div></div><div style="display:flex;align-items:center"><div class="amount">${money(e.qty*e.price)}</div>${canManage()?`<button class="del" data-del="${e.id}">✕</button>`:''}</div></div>`).join(''):'<div class="empty-note">No purchases logged yet.</div>'}</div>`;
    document.querySelectorAll('[data-cat]').forEach(x=>x.onclick=()=>{state.category=x.dataset.cat;renderLog()});
    $('f-add').onclick=addPurchase;
    document.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>deletePurchase(x.dataset.del));
  }

  async function addPurchase(){
    if(!canEdit())return alert('Your account is read-only.');
    const item=$('f-item').value.trim(), q=Number($('f-qty').value), unit=$('f-unit').value.trim(), price=Number($('f-price').value), date=$('f-date').value||today();
    if(!item||!q||isNaN(price))return alert('Please fill Item, Quantity and Unit price.');
    const {data,error}=await db.from('purchases').insert({restaurant:state.restaurant,category:state.category,item,qty:q,unit,price,date}).select().single();
    if(error)return alert(error.message);
    await audit('create','purchase',{id:data.id,item,qty:q,restaurant:state.restaurant});
    const existing=state.products.find(p=>p.item.toLowerCase()===item.toLowerCase()&&p.category===state.category);
    if(existing){await db.from('inventory').update({current_qty:Number(existing.current_qty)+q,updated_at:new Date().toISOString()}).eq('id',existing.id);await audit('stock_in','inventory',{item,qty:q})}
    await refresh();
  }

  async function deletePurchase(id){
    if(!confirm('Delete this purchase?'))return;
    const {error}=await db.from('purchases').delete().eq('id',id);if(error)return alert(error.message);
    await audit('delete','purchase',{id});await refresh();
  }

  async function renderList(){
    await loadShopping();
    const grouped={};state.shoppingItems.forEach(x=>(grouped[x.category]??=[]).push(x));
    $('view-list').innerHTML=`<div class="card"><div class="week-picker"><button id="s-prev">‹</button><div class="label">WEEK OF ${weekLabel(state.listWeek).toUpperCase()}</div><button id="s-next">›</button></div>
      <div class="cat-pills">${catPills(state.listCategory,'listcat')}</div>
      <div class="field"><label>Item to buy</label><input id="s-item" placeholder="e.g. Rice"></div>
      <div class="row-2"><div class="field"><label>Quantity</label><input id="s-qty" type="number" inputmode="decimal"></div><div class="field"><label>Unit</label><input id="s-unit" placeholder="bag, box..."></div></div>
      <button class="shopping-add-btn" id="s-add">Add to shopping list</button>
      <div class="shopping-actions"><button class="primary" id="s-share">📤 Send to patronne</button><button id="s-smart">✨ Smart list</button></div></div>
      <div class="section-label">To buy — ${RESTAURANTS[state.restaurant]}</div><div class="card" style="padding:6px 16px">${state.shoppingItems.length?CATEGORIES.map(c=>(grouped[c]||[]).length?`<div class="summary-cat-header"><div class="bar" style="background:${CAT_COLOR[c]}"></div><span>${c}</span></div>`+(grouped[c]||[]).map(x=>`<div class="shopping-row"><div class="info"><span class="dot" style="background:${CAT_COLOR[c]}"></span><div class="text"><div class="item-name">${esc(x.item)}</div><div class="meta">${weekLabel(state.listWeek)}</div></div></div><div style="display:flex;align-items:center"><div class="qty">${qty(x.qty)} ${esc(x.unit||'')}</div>${canManage()?`<button class="remove-list" data-rm="${x.id}">✕</button>`:''}</div></div>`).join(''):'').join(''):'<div class="shopping-empty">No items.</div>'}</div>`;
    document.querySelectorAll('[data-listcat]').forEach(x=>x.onclick=()=>{state.listCategory=x.dataset.listcat;renderList()});
    $('s-add').onclick=addShopping; $('s-share').onclick=shareList; $('s-smart').onclick=generateSmartList;
    $('s-prev').onclick=async()=>{state.listWeek=shiftWeek(state.listWeek,-1);await renderList()};
    $('s-next').onclick=async()=>{state.listWeek=shiftWeek(state.listWeek,1);await renderList()};
    document.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>removeShopping(x.dataset.rm));
  }

  async function addShopping(){
    const item=$('s-item').value.trim(),q=Number($('s-qty').value),unit=$('s-unit').value.trim();if(!item||!q)return alert('Enter item and quantity.');
    const {data,error}=await db.from('shopping_list').insert({restaurant:state.restaurant,category:state.listCategory,item,qty:q,unit,week_start:state.listWeek}).select().single();
    if(error)return alert(error.message);await audit('create','shopping_list',{id:data.id,item,qty:q});await renderList();
  }
  async function removeShopping(id){if(!confirm('Remove this item?'))return;const {error}=await db.from('shopping_list').delete().eq('id',id);if(error)return alert(error.message);await audit('delete','shopping_list',{id});await renderList()}
  async function generateSmartList(){
    await loadProducts();
    const low=state.products.filter(p=>Number(p.current_qty)<Number(p.min_qty));
    if(!low.length)return alert('No products are below their minimum stock.');
    for(const p of low){const need=Math.max(0,Number(p.min_qty)-Number(p.current_qty));await db.from('shopping_list').insert({restaurant:state.restaurant,category:p.category,item:p.item,qty:need,unit:p.unit||'',week_start:state.listWeek});await audit('smart_add','shopping_list',{item:p.item,qty:need})}
    state.tab='list';await renderAll();
  }
  function buildListText(){let out=`EL GORDO — SHOPPING LIST\n${RESTAURANTS[state.restaurant]}\nWeek: ${weekLabel(state.listWeek)}\n`;for(const c of CATEGORIES){const rows=state.shoppingItems.filter(x=>x.category===c);if(!rows.length)continue;out+=`\n${c.toUpperCase()}\n`;rows.forEach(x=>out+=`• ${x.item} — ${qty(x.qty)}${x.unit?' '+x.unit:''}\n`)}return out}
  async function shareList(){await loadShopping();if(!state.shoppingItems.length)return alert('Shopping list is empty.');const text=buildListText();if(navigator.share){try{await navigator.share({title:'El Gordo Shopping List',text})}catch(e){}}else{await navigator.clipboard?.writeText(text);alert('List copied.')}}

  async function renderSummary(){
    const rows=state.entries.filter(e=>e.restaurant===state.restaurant&&e.date.startsWith(state.summaryMonth));
    let total=0;const blocks=CATEGORIES.map(c=>{const items={};rows.filter(e=>e.category===c).forEach(e=>{items[e.item]??={qty:0,amount:0};items[e.item].qty+=e.qty;items[e.item].amount+=e.qty*e.price});const arr=Object.entries(items);const sub=arr.reduce((s,[,v])=>s+v.amount,0);total+=sub;return `<div class="summary-cat-header"><div class="bar" style="background:${CAT_COLOR[c]}"></div><span>${c}</span></div>${arr.length?`<table class="summary-table"><thead><tr><th>Item</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${arr.map(([k,v])=>`<tr><td class="item-cell">${esc(k)}</td><td class="num-cell">${qty(v.qty)}</td><td class="num-cell">${money(v.amount)}</td></tr>`).join('')}</tbody></table><div class="cat-subtotal" style="border-left:3px solid ${CAT_COLOR[c]}"><span>${c} total</span><span class="val">${money(sub)}</span></div>`:'<div class="empty-note">No items this month.</div>'}`}).join('');
    $('view-summary').innerHTML=`<div class="card"><div class="month-picker"><button id="m-prev">‹</button><div class="label">${monthLabel(state.summaryMonth).toUpperCase()}</div><button id="m-next">›</button></div><div style="font-size:11px;color:var(--ink-soft);text-align:center;margin-bottom:8px">${RESTAURANTS[state.restaurant]}</div><div class="shopping-actions"><button class="primary" id="excel">📊 Excel</button><button id="report">📄 PDF / Report</button></div>${blocks}<div class="grand-total"><span>Total</span><span class="val">${money(total)}</span></div></div>`;
    $('m-prev').onclick=()=>{state.summaryMonth=shiftMonth(state.summaryMonth,-1);renderSummary()};$('m-next').onclick=()=>{state.summaryMonth=shiftMonth(state.summaryMonth,1);renderSummary()};$('excel').onclick=exportExcel;$('report').onclick=exportReport;
  }
  function exportExcel(){
    if(!window.XLSX)return alert('Excel library unavailable.');
    const rows=state.entries.filter(e=>e.restaurant===state.restaurant&&e.date.startsWith(state.summaryMonth)).map(e=>({Date:e.date,Restaurant:RESTAURANTS[e.restaurant],Category:e.category,Item:e.item,Quantity:e.qty,Unit:e.unit||'','Unit Price ($)':e.price,'Total ($)':e.qty*e.price}));
    if(!rows.length)return alert('No purchases this month.');
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Purchases');XLSX.writeFile(wb,`El-Gordo-${state.restaurant}-${state.summaryMonth}.xlsx`);
  }
  function exportReport(){
    const old=document.title;document.title=`El Gordo Report ${state.summaryMonth}`;window.print();setTimeout(()=>document.title=old,500)
  }
  function exportBackup(){
    const payload={exported_at:new Date().toISOString(),restaurant:state.restaurant,purchases:state.entries,shopping_list:state.shoppingItems,inventory:state.products};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`el-gordo-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href);
  }

  async function renderAdmin(){
    if(!isAdmin()){ $('view-admin').innerHTML='<div class="card">Admin only.</div>';return}
    await loadProducts();await loadAudit(); const profiles=await loadProfiles();
    $('view-admin').innerHTML=`<div class="card"><h3 style="margin-top:0">⚙️ Inventory & minimums</h3><p style="font-size:11px;color:var(--ink-soft)">Set minimum stock so Smart Shopping List can generate weekly orders.</p>
      <div class="field"><label>Item</label><input id="p-item" placeholder="Rice"></div>
      <div class="row-2"><div class="field"><label>Category</label><select id="p-cat" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:7px">${CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Unit</label><input id="p-unit" placeholder="bag"></div></div>
      <div class="row-2"><div class="field"><label>Current stock</label><input id="p-current" type="number"></div><div class="field"><label>Minimum</label><input id="p-min" type="number"></div></div><button class="add-btn" id="p-save">Save product</button></div>
      <div class="card"><div style="font-weight:800;margin-bottom:8px">Products — ${RESTAURANTS[state.restaurant]}</div>${state.products.length?state.products.map(p=>`<div class="product-row"><div><b>${esc(p.item)}</b><div class="meta">${p.category} · min ${qty(p.min_qty)} ${esc(p.unit||'')}</div></div><div class="${Number(p.current_qty)<Number(p.min_qty)?'stock-low':'stock-ok'}">${qty(p.current_qty)} ${esc(p.unit||'')}</div></div>`).join(''):'No products configured.'}</div>
      <div class="card"><div style="font-weight:800;margin-bottom:8px">👥 User roles</div>
        ${profiles.map(p=>`<div class="product-row"><div><b>${esc(p.email||p.id)}</b><div class="meta">${p.id===user.id?'You':''}</div></div>
        <select data-role-id="${p.id}" style="padding:7px;border:1px solid var(--line);border-radius:7px">
          ${['admin','manager','employee','viewer'].map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${r}</option>`).join('')}
        </select></div>`).join('')}
      </div>
      <div class="card"><div style="font-weight:800;margin-bottom:8px">Recent activity</div>${state.audit.slice(0,30).map(a=>`<div class="audit-row"><b>${esc(a.action)}</b> · ${esc(a.user_email||'')}<br><span style="color:var(--ink-soft)">${new Date(a.created_at).toLocaleString()} · ${esc(JSON.stringify(a.details||{}))}</span></div>`).join('')||'No activity yet.'}</div>`;
    $('p-save').onclick=saveProduct;
    document.querySelectorAll('[data-role-id]').forEach(s=>s.onchange=()=>updateRole(s.dataset.roleId,s.value));
  }
  async function saveProduct(){
    const item=$('p-item').value.trim(),category=$('p-cat').value,unit=$('p-unit').value.trim(),current=Number($('p-current').value),min=Number($('p-min').value);
    if(!item||isNaN(current)||isNaN(min))return alert('Fill item, current stock and minimum.');
    const {error}=await db.from('inventory').upsert({restaurant:state.restaurant,item,category,unit,current_qty:current,min_qty:min,updated_at:new Date().toISOString()},{onConflict:'restaurant,item'});
    if(error)return alert(error.message);await audit('upsert','inventory',{item,category,current,min});await renderAdmin();
  }

  async function loadProfile(){
    const {data:{user:u}}=await db.auth.getUser();user=u;if(!u)return;
    const {data}=await db.from('profiles').select('*').eq('id',u.id).maybeSingle();
    profile=data||{id:u.id,role:'employee',email:u.email};
    $('user-email').textContent=u.email||'';$('role-pill').textContent=profile.role||'employee';
  }

  async function refresh(){
    await loadEntries();await loadShopping();await loadProducts();renderAll();
  }
  async function renderAll(){
    renderNav();
    if(state.tab==='dashboard')await renderDashboard();
    if(state.tab==='log')renderLog();
    if(state.tab==='list')await renderList();
    if(state.tab==='summary')await renderSummary();
    if(state.tab==='admin')await renderAdmin();
  }

  async function boot(){
    db.auth.onAuthStateChange(async(_event,session)=>{
      if(session){await loadProfile();$('auth').style.display='none';$('app').style.display='block';await refresh();startRealtime()}
      else{$('auth').style.display='flex';$('app').style.display='none'}
    });
    const {data:{session}}=await db.auth.getSession();
    if(session){await loadProfile();$('auth').style.display='none';$('app').style.display='block';await refresh();startRealtime()}
  }
  let realtimeStarted=false;
  function startRealtime(){
    if(realtimeStarted)return;realtimeStarted=true;
    db.channel('el-gordo-live').on('postgres_changes',{event:'*',schema:'public',table:'purchases'},async()=>{await loadEntries();await renderAll()})
      .on('postgres_changes',{event:'*',schema:'public',table:'shopping_list'},async()=>{if(state.tab==='list')await renderList()})
      .on('postgres_changes',{event:'*',schema:'public',table:'inventory'},async()=>{await loadProducts();if(state.tab==='dashboard'||state.tab==='admin')await renderAll()})
      .subscribe();
  }

  $('auth-signin').onclick=async()=>{
    const email=$('auth-email').value.trim(),password=$('auth-password').value;
    const {error}=await db.auth.signInWithPassword({email,password});
    if(error){$('auth-error').textContent=error.message;$('auth-error').style.display='block'}
  };
  $('signout').onclick=async()=>{if(confirm('Sign out?'))await db.auth.signOut()};
  $('btn-union').onclick=async()=>{state.restaurant='union';await refresh()};
  $('btn-jersey').onclick=async()=>{state.restaurant='jersey';await refresh()};
  $('tab-dashboard').onclick=async()=>{state.tab='dashboard';await renderAll()};
  $('tab-log').onclick=async()=>{state.tab='log';await renderAll()};
  $('tab-list').onclick=async()=>{state.tab='list';await renderAll()};
  $('tab-summary').onclick=async()=>{state.tab='summary';await renderAll()};
  $('tab-admin').onclick=async()=>{state.tab='admin';await renderAll()};
  boot();
})();
</script>
</body></html>
