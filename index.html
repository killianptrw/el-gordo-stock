  function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function money(n){return '$'+(Math.round(Number(n||0)*100)/100).toFixed(2)}
  function qty(n){return (Math.round(Number(n||0)*100)/100).toString()}
  function today(){return new Date().toISOString().slice(0,10)}
  function monday(d){d=new Date(d);d.setHours(12,0,0,0);let day=d.getDay();d.setDate(d.getDate()+(day===0?-6:1-day));return d.toISOString().slice(0,10)}
  function getMondayISO(d){return monday(d)}
  function shiftWeek(i,n){let d=new Date(i+'T12:00:00');d.setDate(d.getDate()+7*n);return d.toISOString().slice(0,10)}
  function weekLabel(i){let s=new Date(i+'T12:00:00'),e=new Date(s);e.setDate(e.getDate()+6);return `${s.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${e.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`}
  function monthLabel(ym){let [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}
  function shiftMonth(ym,n){let [y,m]=ym.split('-').map(Number);m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}return `${y}-${String(m).padStart(2,'0')}`}
  function isAdmin(){return profile?.role==='admin'}
  function canEdit(){return ['admin','manager','employee'].includes(profile?.role)}
  function canManage(){return ['admin','manager'].includes(profile?.role)}

  async function audit(action,entity,details={}){
    try{
      await db.from('audit_logs').insert({user_id:user.id,action,table_name:entity,record_id:details?.id?String(details.id):null,details:{...details,user_email:user?.email||''}})
    }catch(e){console.warn('audit',e)}
  }
  async function loadEntries(){
    const {data,error}=await db.from('purchases').select('*').order('date',{ascending:false}).order('created_at',{ascending:false});
    if(error){console.error(error);return}
    state.entries=(data||[]).map(e=>({...e,qty:Number(e.qty),price:Number(e.price),subcategory:e.subcategory||''}));
  }
  async function loadShopping(){
    const {data,error}=await db.from('shopping_list').select('*').eq('restaurant',state.restaurant).eq('week_start',state.listWeek).order('category').order('created_at');
    if(!error) state.shoppingItems=data||[];
  }
  async function loadNotes(){
    const {data,error}=await db.from('notes').select('*').eq('restaurant',state.restaurant).order('pinned',{ascending:false}).order('updated_at',{ascending:false});
    state.notes=error?[]:(data||[]);
  }
  async function loadProducts(){
    const {data,error}=await db.from('inventory').select('*').eq('restaurant',state.restaurant).order('item');
    state.products=error?[]:data||[];
  }
  async function loadProfiles(){
    const {data,error}=await db.from('profiles').select('*').order('email');
    return error?[]:(data||[]);
  }
  async function updateRole(id,role){
    const {error}=await db.from('profiles').update({role}).eq('id',id);
    if(error)return alert(error.message);
    await audit('role_change','profile',{id,role});
    await renderAdmin();
  }
  async function loadAudit(){
    const {data,error}=await db.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(100);
    state.audit=error?[]:data||[];
  }

  function renderNav(){
    ['dashboard','log','list','notes','summary','admin'].forEach(t=>{let b=$('tab-'+t);if(b)b.classList.toggle('active',state.tab===t)});
    $('view-dashboard').style.display=state.tab==='dashboard'?'block':'none';
    $('view-log').style.display=state.tab==='log'?'block':'none';
    $('view-list').style.display=state.tab==='list'?'block':'none';
    $('view-notes').style.display=state.tab==='notes'?'block':'none';
    $('view-summary').style.display=state.tab==='summary'?'block':'none';
    $('view-admin').style.display=state.tab==='admin'?'block':'none';
    $('btn-union').classList.toggle('active',state.restaurant==='union');
    $('btn-jersey').classList.toggle('active',state.restaurant==='jersey');
    $('tab-admin').style.display=isAdmin()?'block':'none';
  }

  function noteTypeInfo(type){
    const m={important:['📌','Important','#b8862c'],communication:['📢','Communication','#4d7896'],note:['📝','Note','#6b6b6b'],urgent:['⚠️','Urgent','#b5432e'],event:['📅','Event','#628b62']};
    return m[type]||m.note;
  }
  function formatNoteDate(v){return new Date(v).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
  function renderPinnedDashboard(){
    const pinned=state.notes.filter(n=>n.pinned).slice(0,3);
    return `<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><div style="font-weight:800">📌 Pinned information</div><button class="mini-btn" id="dash-notes">View all</button></div>${pinned.length?`<div class="notes-grid" style="margin-top:9px">${pinned.map(n=>{const [ico,label,color]=noteTypeInfo(n.type);return `<div class="note-card pinned"><span class="note-accent" style="background:${color}"></span><div class="note-head"><div><div class="note-title">${ico} ${esc(n.title)}</div><div class="note-body">${esc(n.body)}</div></div><span class="pin-mark">📌</span></div><div class="note-meta"><span>${esc(label)} · ${formatNoteDate(n.updated_at)}</span><span>${esc(n.updated_by_email||n.created_by_email||'')}</span></div></div>`}).join('')}</div>`:'<div class="notes-empty" style="padding:16px 4px">No pinned information yet.</div>'}</div>`;
  }

    $('view-dashboard').innerHTML=`
      <div class="dashboard-grid">
        <div class="stat"><div class="label">This week</div><div class="value">${money(spend)}</div></div>
        <div class="stat"><div class="label">Shopping items</div><div class="value">${pending}</div></div>
        <div class="stat"><div class="label">Low stock</div><div class="value">${low.length}</div></div>
        <div class="stat"><div class="label">Purchases</div><div class="value">${weekEntries.length}</div></div>
      </div>
      ${low.length?`<div class="alert-card"><strong>⚠️ Low stock</strong><div style="margin-top:6px">${low.slice(0,8).map(p=>`• ${esc(p.item)} — ${qty(p.current_qty)} ${esc(p.unit)} / min ${qty(p.min_qty)}`).join('<br>')}</div><button class="mini-btn" id="generate-smart" style="margin-top:10px">✨ Generate shopping list</button></div>`:''}
      <div class="card"><div class="section-label" style="margin:0 0 8px">This week by area</div>
        ${catTotals.map(x=>`<div class="bar-row"><span>${x.c}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(x.total/max*100)}%;background:${CAT_COLOR[x.c]}"></div></div><b>${money(x.total)}</b></div>`).join('')}
      </div>
      <div class="alert-card" style="background:#fff;border-color:var(--line)">
        <strong>📅 Weekly order reminder</strong>
        <div style="margin-top:5px;color:var(--ink-soft)">Use this reminder when you prepare the weekly order for your patronne.</div>
        <button class="mini-btn" id="reminder-btn" style="margin-top:9px">Enable reminder</button>
      </div>
      ${renderPinnedDashboard()}
      <div class="card">
        <div style="font-weight:800;margin-bottom:8px">Quick actions</div>
        <div class="shopping-actions">
          <button id="dash-log">➕ Purchase</button><button id="dash-list" class="primary">🛒 Shopping list</button>
        </div>
        <div class="shopping-actions">
          <button id="dash-report">📄 Report / PDF</button><button id="dash-backup">💾 Backup data</button>
        </div>
      </div>`;
    $('dash-log').onclick=()=>{state.tab='log';renderAll()};
    $('dash-list').onclick=()=>{state.tab='list';renderAll()};
    $('dash-report').onclick=exportReport;
    $('dash-backup').onclick=exportBackup;
    const g=$('generate-smart'); if(g)g.onclick=generateSmartList;
    const rb=$('reminder-btn');
    if(rb){
      rb.textContent=localStorage.getItem('elgordo_weekly_reminder')==='1'?'✓ Reminder enabled':'Enable reminder';
      rb.onclick=()=>{localStorage.setItem('elgordo_weekly_reminder','1');rb.textContent='✓ Reminder enabled';alert('Reminder enabled on this device. Open the app on your weekly order day to see the reminder.');};
    }

  function catPills(selected,attr){return CATEGORIES.map(c=>`<div class="cat-pill ${c===selected?'active':''}" data-${attr}="${c}">${c}</div>`).join('')}

  function renderLog(){
    const entries=state.entries.filter(e=>e.restaurant===state.restaurant).slice(0,40);
    $('view-log').innerHTML=`<div class="card"><div class="cat-pills">${catPills(state.category,'cat')}</div>
      <div class="field"><label>Item</label><input id="f-item" placeholder="e.g. Whole chicken"></div>
      <div class="row-2"><div class="field"><label>Quantity</label><input id="f-qty" type="number" step="0.01" inputmode="decimal"></div><div class="field"><label>Unit</label><select id="f-unit">${UNITS.map(u=>`<option value="${u}">${u}</option>`).join('')}<option value="">Custom...</option></select></div></div><div class="field"><label>Subcategory</label><select id="f-subcategory"><option value="">Select a subcategory</option>${SUBCATEGORIES.map(x=>`<option value="${x}">${x}</option>`).join('')}</select></div>
      <div class="row-2"><div class="field"><label>Unit price ($)</label><input id="f-price" type="number" step="0.01" inputmode="decimal"></div><div class="field"><label>Date</label><input id="f-date" type="date" value="${today()}"></div></div>
      <button class="add-btn" id="f-add">Add to log</button></div>
      <div class="section-label">Recent — ${RESTAURANTS[state.restaurant]}</div>
      <div class="card" style="padding:6px 16px">${entries.length?entries.map(e=>`<div class="log-entry"><div class="info"><span class="dot" style="background:${CAT_COLOR[e.category]}"></span><div class="text"><div class="item-name">${esc(e.item)}</div><div class="meta">${e.date} · ${qty(e.qty)} ${esc(e.unit)} · ${e.category}${e.subcategory?` · ${esc(e.subcategory)}`:''}</div></div></div><div style="display:flex;align-items:center"><div class="amount">${money(e.qty*e.price)}</div>${canManage()?`<button class="del" data-del="${e.id}">✕</button>`:''}</div></div>`).join(''):'<div class="empty-note">No purchases logged yet.</div>'}</div>`;
    document.querySelectorAll('[data-cat]').forEach(x=>x.onclick=()=>{state.category=x.dataset.cat;renderLog()});
    $('f-add').onclick=addPurchase;
    document.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>deletePurchase(x.dataset.del));

  async function addPurchase(){
    if(!canEdit())return alert('Your account is read-only.');
    const item=$('f-item').value.trim(), q=Number($('f-qty').value), unit=$('f-unit').value, subcategory=$('f-subcategory').value, price=Number($('f-price').value), date=$('f-date').value||today();
    if(!item||!q||!unit||!subcategory||isNaN(price))return alert('Please fill Item, Quantity, Unit, Subcategory and Unit price.');
    const {data,error}=await db.from('purchases').insert({restaurant:state.restaurant,category:state.category,subcategory,item,qty:q,unit,price,date}).select().single();
    if(error)return alert(error.message);
    await audit('create','purchase',{id:data.id,item,qty:q,restaurant:state.restaurant});
    const existing=state.products.find(p=>p.item.toLowerCase()===item.toLowerCase()&&p.category===state.category);
    if(existing){await db.from('inventory').update({current_qty:Number(existing.current_qty)+q,updated_at:new Date().toISOString()}).eq('id',existing.id);await audit('stock_in','inventory',{item,qty:q})}
    await refresh();
  }

  async function deletePurchase(id){
    if(!confirm('Delete this purchase?'))return;
    const {error}=await db.from('purchases').delete().eq('id',id);if(error)return alert(error.message);
    await audit('delete','purchase',{id});await refresh();
  }

  async function renderList(){
    await loadShopping();
    const grouped={};state.shoppingItems.forEach(x=>(grouped[x.category]??=[]).push(x));
    $('view-list').innerHTML=`<div class="card"><div class="week-picker"><button id="s-prev">‹</button><div class="label">WEEK OF ${weekLabel(state.listWeek).toUpperCase()}</div><button id="s-next">›</button></div>
      <div class="cat-pills">${catPills(state.listCategory,'listcat')}</div>
      <div class="field"><label>Item to buy</label><input id="s-item" placeholder="e.g. Rice"></div>
      <div class="row-2"><div class="field"><label>Quantity</label><input id="s-qty" type="number" inputmode="decimal"></div><div class="field"><label>Unit</label><input id="s-unit" placeholder="bag, box..."></div></div>
      <button class="shopping-add-btn" id="s-add">Add to shopping list</button>
      <div class="shopping-actions"><button class="primary" id="s-share">📤 Send to patronne</button><button id="s-smart">✨ Smart list</button></div></div>
      <div class="section-label">To buy — ${RESTAURANTS[state.restaurant]}</div><div class="card" style="padding:6px 16px">${state.shoppingItems.length?CATEGORIES.map(c=>(grouped[c]||[]).length?`<div class="summary-cat-header"><div class="bar" style="background:${CAT_COLOR[c]}"></div><span>${c}</span></div>`+(grouped[c]||[]).map(x=>`<div class="shopping-row"><div class="info"><span class="dot" style="background:${CAT_COLOR[c]}"></span><div class="text"><div class="item-name">${esc(x.item)}</div><div class="meta">${weekLabel(state.listWeek)}</div></div></div><div style="display:flex;align-items:center"><div class="qty">${qty(x.qty)} ${esc(x.unit||'')}</div>${canManage()?`<button class="remove-list" data-rm="${x.id}">✕</button>`:''}</div></div>`).join(''):'').join(''):'<div class="shopping-empty">No items.</div>'}</div>`;
    document.querySelectorAll('[data-listcat]').forEach(x=>x.onclick=()=>{state.listCategory=x.dataset.listcat;renderList()});
    $('s-add').onclick=addShopping; $('s-share').onclick=shareList; $('s-smart').onclick=generateSmartList;
    $('s-prev').onclick=async()=>{state.listWeek=shiftWeek(state.listWeek,-1);await renderList()};
    $('s-next').onclick=async()=>{state.listWeek=shiftWeek(state.listWeek,1);await renderList()};
    document.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>removeShopping(x.dataset.rm));
  }

  async function addShopping(){
    const item=$('s-item').value.trim(),q=Number($('s-qty').value),unit=$('s-unit').value.trim();if(!item||!q)return alert('Enter item and quantity.');
    const {data,error}=await db.from('shopping_list').insert({restaurant:state.restaurant,category:state.listCategory,item,qty:q,unit,week_start:state.listWeek}).select().single();
    if(error)return alert(error.message);await audit('create','shopping_list',{id:data.id,item,qty:q});await renderList();
  }
  async function removeShopping(id){if(!confirm('Remove this item?'))return;const {error}=await db.from('shopping_list').delete().eq('id',id);if(error)return alert(error.message);await audit('delete','shopping_list',{id});await renderList()}
  async function generateSmartList(){
    await loadProducts();
    const low=state.products.filter(p=>Number(p.current_qty)<Number(p.min_qty));
    if(!low.length)return alert('No products are below their minimum stock.');
    for(const p of low){const need=Math.max(0,Number(p.min_qty)-Number(p.current_qty));await db.from('shopping_list').insert({restaurant:state.restaurant,category:p.category,item:p.item,qty:need,unit:p.unit||'',week_start:state.listWeek});await audit('smart_add','shopping_list',{item:p.item,qty:need})}
    state.tab='list';await renderAll();
  }
  function buildListText(){let out=`EL GORDO — SHOPPING LIST\n${RESTAURANTS[state.restaurant]}\nWeek: ${weekLabel(state.listWeek)}\n`;for(const c of CATEGORIES){const rows=state.shoppingItems.filter(x=>x.category===c);if(!rows.length)continue;out+=`\n${c.toUpperCase()}\n`;rows.forEach(x=>out+=`• ${x.item} — ${qty(x.qty)}${x.unit?' '+x.unit:''}\n`)}return out}
  async function shareList(){await loadShopping();if(!state.shoppingItems.length)return alert('Shopping list is empty.');const text=buildListText();if(navigator.share){try{await navigator.share({title:'El Gordo Shopping List',text})}catch(e){}}else{await navigator.clipboard?.writeText(text);alert('List copied.')}}

    const filtered=state.noteFilter==='all'?state.notes:state.notes.filter(n=>n.type===state.noteFilter);

      <div class="card note-compose">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px"><div><div class="section-label" style="margin-bottom:3px">Team board</div><div style="font-size:18px;font-weight:850">📌 Communications</div></div><span class="role-pill">${RESTAURANTS[state.restaurant]}</span></div>
        ${canWrite?`<div class="field"><label>Type</label><select id="n-type"><option value="important">📌 Important</option><option value="communication">📢 Communication</option><option value="note">📝 Note</option><option value="urgent">⚠️ Urgent</option><option value="event">📅 Event</option></select></div>
        <div class="field"><label>Title</label><input id="n-title" maxlength="100" placeholder="e.g. Delivery moved to 2 PM"></div>
        <div class="field"><label>Message</label><textarea id="n-body" maxlength="1000" placeholder="Write the information your team needs to see..."></textarea></div>
        <div class="shopping-actions"><button id="n-cancel" style="display:${editing?'block':'none'}">Cancel edit</button><button class="primary" id="n-save">${editing?'Save changes':'Publish note'}</button></div>`:'<div class="notes-empty">Your account is view-only. You can read communications but cannot publish them.</div>'}
      </div>
      <div class="card" style="padding:14px">
        <div class="notes-filter">${[['all','All'],['important','📌 Important'],['communication','📢 Communication'],['note','📝 Notes'],['urgent','⚠️ Urgent'],['event','📅 Events']].map(([v,l])=>`<button data-note-filter="${v}" class="${state.noteFilter===v?'active':''}">${l}</button>`).join('')}</div>
        <div class="notes-grid">${filtered.length?filtered.map((n,i)=>{const [ico,label,color]=noteTypeInfo(n.type);const own=String(n.created_by)===String(user.id);const manage=canManage()||own;return `<div class="note-card ${n.pinned?'pinned':''}" style="animation-delay:${Math.min(i,8)*.03}s"><span class="note-accent" style="background:${color}"></span><div class="note-head"><div><div class="note-title">${ico} ${esc(n.title)}</div><div style="margin-top:5px"><span class="note-type">${label}</span>${n.pinned?'<span class="note-type" style="margin-left:5px">📌 Pinned</span>':''}</div></div></div><div class="note-body">${esc(n.body)}</div><div class="note-meta"><span>${formatNoteDate(n.updated_at)} · ${esc(n.updated_by_email||n.created_by_email||'')}</span><span>${n.updated_at!==n.created_at?'Edited':''}</span></div>${manage?`<div class="note-actions"><button class="pin" data-note-pin="${n.id}">${n.pinned?'📌 Unpin':'📌 Pin'}</button><button data-note-edit="${n.id}">✏️ Edit</button><button class="danger" data-note-delete="${n.id}">🗑 Delete</button></div>`:''}</div>`}).join(''):'<div class="notes-empty">No communications yet. Publish the first one above.</div>'}</div>
      </div>`;
    if(!canWrite)return;

    document.querySelectorAll('[data-note-filter]').forEach(b=>b.onclick=()=>{state.noteFilter=b.dataset.noteFilter;renderNotes()});
    document.querySelectorAll('[data-note-edit]').forEach(b=>b.onclick=()=>{state.editingNoteId=b.dataset.noteEdit;renderNotes();$('view-notes').scrollIntoView({behavior:'smooth',block:'start'})});
    document.querySelectorAll('[data-note-delete]').forEach(b=>b.onclick=()=>deleteNote(b.dataset.noteDelete));
    document.querySelectorAll('[data-note-pin]').forEach(b=>b.onclick=()=>togglePin(b.dataset.notePin));

  async function saveNote(){
    const type=$('n-type').value,title=$('n-title').value.trim(),body=$('n-body').value.trim();
    if(!title||!body)return alert('Please add a title and message.');
    if(!canEdit())return;
    let error,data;
    if(state.editingNoteId){
      ({error}=await db.from('notes').update({type,title,body,updated_by:user.id,updated_by_email:user.email,updated_at:new Date().toISOString()}).eq('id',state.editingNoteId));
      if(error)return alert(error.message);await audit('update','notes',{id:state.editingNoteId,title});
    }else{
      ({data,error}=await db.from('notes').insert({restaurant:state.restaurant,type,title,body,pinned:false,created_by:user.id,created_by_email:user.email,updated_by:user.id,updated_by_email:user.email}).select().single());
      if(error)return alert(error.message);await audit('create','notes',{id:data.id,title});
    }
    state.editingNoteId=null;await renderAll();
  }
  async function deleteNote(id){
    const n=state.notes.find(x=>String(x.id)===String(id));if(!n)return;
    if(!(canManage()||String(n.created_by)===String(user.id)))return alert('You cannot delete this note.');
    if(!confirm(`Delete “${n.title}”?`))return;
    const {error}=await db.from('notes').delete().eq('id',id);if(error)return alert(error.message);await audit('delete','notes',{id,title:n.title});await renderNotes();
  }
  async function togglePin(id){
    const n=state.notes.find(x=>String(x.id)===String(id));if(!n)return;
    if(!(canManage()||String(n.created_by)===String(user.id)))return alert('You cannot pin this note.');
    const {error}=await db.from('notes').update({pinned:!n.pinned,updated_by:user.id,updated_by_email:user.email,updated_at:new Date().toISOString()}).eq('id',id);
    if(error)return alert(error.message);await audit(n.pinned?'unpin':'pin','notes',{id,title:n.title});await renderAll();
  }

  async function renderSummary(){
    const monthRows=state.entries.filter(e=>e.restaurant===state.restaurant&&e.date.startsWith(state.summaryMonth));
    const allRows=state.entries.filter(e=>e.restaurant===state.restaurant);
    let total=0;
    const blocks=CATEGORIES.map(c=>{
      const items={};
      monthRows.filter(e=>e.category===c).forEach(e=>{
        const key=`${e.item}|||${e.unit||''}`;
        items[key]??={item:e.item,unit:e.unit||'',qty:0,amount:0};
        items[key].qty+=e.qty;items[key].amount+=e.qty*e.price;
      });
      const arr=Object.values(items);
      const sub=arr.reduce((s,v)=>s+v.amount,0);total+=sub;
      return `<div class="summary-cat-header"><div class="bar" style="background:${CAT_COLOR[c]}"></div><span>${c}</span></div>${arr.length?`<table class="summary-table"><thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Unit price</th><th>Total</th><th>All-time qty</th></tr></thead><tbody>${arr.map(v=>{const hist=allRows.filter(e=>e.category===c&&e.item===v.item&&e.unit===v.unit);const hq=hist.reduce((s,e)=>s+e.qty,0);const ha=hist.reduce((s,e)=>s+e.qty*e.price,0);const avg=hq?ha/hq:0;return `<tr><td class="item-cell">${esc(v.item)}${monthRows.find(e=>e.item===v.item&&e.category===c&&e.subcategory)?`<div class="meta">${esc(monthRows.find(e=>e.item===v.item&&e.category===c&&e.subcategory).subcategory||'')}</div>`:''}</td><td class="num-cell">${qty(v.qty)}</td><td class="num-cell">${esc(v.unit||'')}</td><td class="num-cell">${money(avg)}</td><td class="num-cell">${money(v.amount)}</td><td class="num-cell"><b>${qty(hq)}</b></td></tr>`}).join('')}</tbody></table><div class="cat-subtotal" style="border-left:3px solid ${CAT_COLOR[c]}"><span>${c} total</span><span class="val">${money(sub)}</span></div>`:'<div class="empty-note">No items this month.</div>'}`}).join('');
    const allQty=allRows.reduce((s,e)=>s+e.qty,0), allSpend=allRows.reduce((s,e)=>s+e.qty*e.price,0);
    $('view-summary').innerHTML=`<div class="card"><div class="month-picker"><button id="m-prev">‹</button><div class="label">${monthLabel(state.summaryMonth).toUpperCase()}</div><button id="m-next">›</button></div><div style="font-size:11px;color:var(--ink-soft);text-align:center;margin-bottom:8px">${RESTAURANTS[state.restaurant]}</div><div class="dashboard-grid" style="margin-bottom:12px"><div class="stat"><div class="label">This month</div><div class="value">${money(total)}</div></div><div class="stat"><div class="label">Units this month</div><div class="value">${qty(monthRows.reduce((s,e)=>s+e.qty,0))}</div></div><div class="stat"><div class="label">Since start</div><div class="value">${money(allSpend)}</div></div><div class="stat"><div class="label">All-time units</div><div class="value">${qty(allQty)}</div></div></div><div class="shopping-actions"><button class="primary" id="excel">📊 Excel</button><button id="report">📄 PDF / Report</button></div>${blocks}<div class="grand-total"><span>Total this month</span><span class="val">${money(total)}</span></div></div>`;
    $('m-prev').onclick=()=>{state.summaryMonth=shiftMonth(state.summaryMonth,-1);renderSummary()};$('m-next').onclick=()=>{state.summaryMonth=shiftMonth(state.summaryMonth,1);renderSummary()};$('excel').onclick=exportExcel;$('report').onclick=exportReport;
  }
  function exportExcel(){
    if(!window.XLSX)return alert('Excel library unavailable.');
    const rows=state.entries.filter(e=>e.restaurant===state.restaurant&&e.date.startsWith(state.summaryMonth)).map(e=>({Date:e.date,Restaurant:RESTAURANTS[e.restaurant],Category:e.category,Subcategory:e.subcategory||'',Item:e.item,Quantity:e.qty,Unit:e.unit||'','Unit Price ($)':e.price,'Total ($)':e.qty*e.price}));
    if(!rows.length)return alert('No purchases this month.');
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Purchases');XLSX.writeFile(wb,`El-Gordo-${state.restaurant}-${state.summaryMonth}.xlsx`);
  }
  function exportReport(){
    const old=document.title;document.title=`El Gordo Report ${state.summaryMonth}`;window.print();setTimeout(()=>document.title=old,500)
  }
  function exportBackup(){
    const payload={exported_at:new Date().toISOString(),restaurant:state.restaurant,purchases:state.entries,shopping_list:state.shoppingItems,inventory:state.products,notes:state.notes};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`el-gordo-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href);
  }

  async function renderAdmin(){
    if(!isAdmin()){ $('view-admin').innerHTML='<div class="card">Admin only.</div>';return}
    await loadProducts();await loadAudit(); const profiles=await loadProfiles();
    $('view-admin').innerHTML=`<div class="card"><h3 style="margin-top:0">⚙️ Inventory & minimums</h3><p style="font-size:11px;color:var(--ink-soft)">Set minimum stock so Smart Shopping List can generate weekly orders.</p>
      <div class="field"><label>Item</label><input id="p-item" placeholder="Rice"></div>
      <div class="row-2"><div class="field"><label>Category</label><select id="p-cat" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:7px">${CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Unit</label><input id="p-unit" placeholder="bag"></div></div>
      <div class="row-2"><div class="field"><label>Current stock</label><input id="p-current" type="number"></div><div class="field"><label>Minimum</label><input id="p-min" type="number"></div></div><button class="add-btn" id="p-save">Save product</button></div>
      <div class="card"><div style="font-weight:800;margin-bottom:8px">Products — ${RESTAURANTS[state.restaurant]}</div>${state.products.length?state.products.map(p=>`<div class="product-row"><div><b>${esc(p.item)}</b><div class="meta">${p.category} · min ${qty(p.min_qty)} ${esc(p.unit||'')}</div></div><div class="${Number(p.current_qty)<Number(p.min_qty)?'stock-low':'stock-ok'}">${qty(p.current_qty)} ${esc(p.unit||'')}</div></div>`).join(''):'No products configured.'}</div>
      <div class="card"><div style="font-weight:800;margin-bottom:8px">👥 User roles</div>
        ${profiles.map(p=>`<div class="product-row"><div><b>${esc(p.email||p.id)}</b><div class="meta">${p.id===user.id?'You':''}</div></div>
        <select data-role-id="${p.id}" style="padding:7px;border:1px solid var(--line);border-radius:7px">
          ${['admin','manager','employee','viewer'].map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${r}</option>`).join('')}
        </select></div>`).join('')}
      </div>
      <div class="card"><div style="font-weight:800;margin-bottom:8px">Recent activity</div>${state.audit.slice(0,30).map(a=>`<div class="audit-row"><b>${esc(a.action)}</b> · ${esc(a.details?.user_email||'')}<br><span style="color:var(--ink-soft)">${new Date(a.created_at).toLocaleString()} · ${esc(JSON.stringify(a.details||{}))}</span></div>`).join('')||'No activity yet.'}</div>`;
    $('p-save').onclick=saveProduct;
    document.querySelectorAll('[data-role-id]').forEach(s=>s.onchange=()=>updateRole(s.dataset.roleId,s.value));
  }
  async function saveProduct(){
    const item=$('p-item').value.trim(),category=$('p-cat').value,unit=$('p-unit').value.trim(),current=Number($('p-current').value),min=Number($('p-min').value);
    if(!item||isNaN(current)||isNaN(min))return alert('Fill item, current stock and minimum.');
    const {error}=await db.from('inventory').upsert({restaurant:state.restaurant,item,category,unit,current_qty:current,min_qty:min,updated_at:new Date().toISOString()},{onConflict:'restaurant,item'});
    if(error)return alert(error.message);await audit('upsert','inventory',{item,category,current,min});await renderAdmin();
  }

  async function loadProfile(){
    const {data:{user:u}}=await db.auth.getUser();user=u;if(!u)return;
    const {data}=await db.from('profiles').select('*').eq('id',u.id).maybeSingle();
    profile=data||{id:u.id,role:'employee',email:u.email};
    $('user-email').textContent=u.email||'';$('role-pill').textContent=profile.role||'employee';
  }

  async function refresh(){
    await loadEntries();await loadShopping();await loadProducts();await loadNotes();renderAll();
  }
  async function renderAll(){
    renderNav();
    if(state.tab==='dashboard')await renderDashboard();
    if(state.tab==='log')renderLog();
    if(state.tab==='list')await renderList();
    if(state.tab==='notes')await renderNotes();
    if(state.tab==='summary')await renderSummary();
    if(state.tab==='admin')await renderAdmin();
  }

  async function boot(){
    db.auth.onAuthStateChange(async(_event,session)=>{
      if(session){await loadProfile();$('auth').style.display='none';$('app').style.display='block';await refresh();startRealtime()}
      else{$('auth').style.display='flex';$('app').style.display='none'}
    });
    const {data:{session}}=await db.auth.getSession();
    if(session){await loadProfile();$('auth').style.display='none';$('app').style.display='block';await refresh();startRealtime()}
  }
  let realtimeStarted=false;
  function startRealtime(){
    if(realtimeStarted)return;realtimeStarted=true;
    db.channel('el-gordo-live').on('postgres_changes',{event:'*',schema:'public',table:'purchases'},async()=>{await loadEntries();await renderAll()})
      .on('postgres_changes',{event:'*',schema:'public',table:'shopping_list'},async()=>{if(state.tab==='list')await renderList()})
      .on('postgres_changes',{event:'*',schema:'public',table:'inventory'},async()=>{await loadProducts();if(state.tab==='dashboard'||state.tab==='admin')await renderAll()})
      .on('postgres_changes',{event:'*',schema:'public',table:'notes'},async()=>{await loadNotes();if(state.tab==='notes'||state.tab==='dashboard')await renderAll()})
      .subscribe();
  }

  $('auth-signin').onclick=async()=>{
    const email=$('auth-email').value.trim(),password=$('auth-password').value;
    const {error}=await db.auth.signInWithPassword({email,password});
    if(error){$('auth-error').textContent=error.message;$('auth-error').style.display='block'}
  };
  $('signout').onclick=async()=>{if(confirm('Sign out?'))await db.auth.signOut()};
  $('btn-union').onclick=async()=>{state.restaurant='union';await refresh()};
  $('btn-jersey').onclick=async()=>{state.restaurant='jersey';await refresh()};
  $('tab-dashboard').onclick=async()=>{state.tab='dashboard';await renderAll()};
  $('tab-log').onclick=async()=>{state.tab='log';await renderAll()};
  $('tab-list').onclick=async()=>{state.tab='list';await renderAll()};
  $('tab-notes').onclick=async()=>{state.tab='notes';state.editingNoteId=null;await renderAll()};
  $('tab-summary').onclick=async()=>{state.tab='summary';await renderAll()};
  $('tab-admin').onclick=async()=>{state.tab='admin';await renderAll()};
  boot();
})();
</script>
</body></html>
