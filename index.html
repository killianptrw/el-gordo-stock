<style>
  :root {
    --paper: #FAF6EF;
    --paper-dark: #F0E9DA;
    --ink: #2A2420;
    --ink-soft: #6B6156;
    --line: #DDD2BE;
    --kitchen: #A15A34;
    --back: #3D6B8C;
    --front: #4F7A4F;
    --stamp: #B5432E;
    --white: #FFFFFF;
  }

  * { box-sizing: border-box; }

  #app {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    max-width: 480px;
    margin: 0 auto;
    padding: 0 0 40px 0;
    min-height: 100vh;
  }

  .receipt-head {
    text-align: center;
    padding: 22px 16px 16px;
    border-bottom: 2px dashed var(--line);
    position: relative;
  }
  .receipt-head .eyebrow {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  .receipt-head h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-size: 28px;
    margin: 4px 0 2px;
    letter-spacing: 0.5px;
  }
  .receipt-head .sub {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .restaurant-toggle {
    display: flex;
    margin: 16px;
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    overflow: hidden;
  }
  .restaurant-toggle button {
    flex: 1;
    padding: 12px 6px;
    border: none;
    background: var(--white);
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.5px;
    color: var(--ink);
    cursor: pointer;
  }
  .restaurant-toggle button.active {
    background: var(--stamp);
    color: var(--white);
  }
  .restaurant-toggle button:first-child { border-right: 1.5px solid var(--ink); }

  .tabs {
    display: flex;
    margin: 0 16px 12px;
    gap: 6px;
  }
  .tabs button {
    flex: 1;
    padding: 9px 4px;
    border: 1px solid var(--line);
    background: var(--white);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tabs button.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .card {
    background: var(--white);
    margin: 0 16px 16px;
    border-radius: 10px;
    padding: 16px;
    border: 1px solid var(--line);
  }

  .cat-pills {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .cat-pill {
    flex: 1;
    padding: 10px 4px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    text-align: center;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .cat-pill.active[data-cat="Kitchen"] { background: var(--kitchen); border-color: var(--kitchen); color: white; box-shadow: 0 0 0 2px rgba(161,90,52,.18); transform: translateY(-1px); }
  .cat-pill.active[data-cat="Back"] { background: var(--back); border-color: var(--back); color: white; box-shadow: 0 0 0 2px rgba(61,107,140,.18); transform: translateY(-1px); }
  .cat-pill.active[data-cat="Front"] { background: var(--front); border-color: var(--front); color: white; box-shadow: 0 0 0 2px rgba(79,122,79,.18); transform: translateY(-1px); }
  .cat-pill { transition: background .15s ease, color .15s ease, border-color .15s ease, transform .15s ease, box-shadow .15s ease; }
  .cat-pill.active::after { content: " ✓"; font-weight: 800; }

  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--line);
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
    background: var(--paper);
    color: var(--ink);
  }
  .field input:focus { outline: 2px solid var(--stamp); outline-offset: 1px; }

  .row-2 { display: flex; gap: 10px; }
  .row-2 .field { flex: 1; }

  .add-btn {
    width: 100%;
    padding: 13px;
    background: var(--stamp);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14.5px;
    letter-spacing: 0.5px;
    cursor: pointer;
    margin-top: 4px;
  }
  .add-btn:active { opacity: 0.85; }
  .add-btn:disabled { background: var(--line); color: var(--ink-soft); }

  .section-label {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin: 0 20px 8px;
  }

  .log-entry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px dashed var(--line);
  }
  .log-entry:last-child { border-bottom: none; }
  .log-entry .dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block; margin-right: 8px; flex-shrink: 0;
  }
  .log-entry .info { display: flex; align-items: center; min-width: 0; }
  .log-entry .text { min-width: 0; }
  .log-entry .item-name { font-weight: 700; font-size: 13.5px; }
  .log-entry .meta { font-size: 11px; color: var(--ink-soft); font-family: 'Courier New', monospace; }
  .log-entry .amount {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 13.5px;
    white-space: nowrap;
    margin-left: 8px;
  }
  .log-entry .del {
    background: none; border: none; color: var(--ink-soft);
    font-size: 16px; margin-left: 8px; cursor: pointer; padding: 2px 6px;
  }

  .empty-note {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 24px 12px;
    font-style: italic;
  }

  .month-picker {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .month-picker button {
    background: var(--paper-dark);
    border: 1px solid var(--line);
    border-radius: 6px;
    width: 32px; height: 32px;
    font-size: 16px;
    cursor: pointer;
    color: var(--ink);
  }
  .month-picker .label {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
  }

  .summary-cat-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 16px 0 6px;
  }
  .summary-cat-header .bar { width: 4px; height: 14px; border-radius: 2px; }
  .summary-cat-header span {
    font-size: 12px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--ink-soft);
  }

  table.summary-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 4px;
  }
  table.summary-table th {
    text-align: left;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
    padding: 4px 2px;
    border-bottom: 1px solid var(--line);
  }
  table.summary-table th:not(:first-child), table.summary-table td:not(:first-child) {
    text-align: right;
  }
  table.summary-table td {
    padding: 7px 2px;
    font-size: 13px;
    border-bottom: 1px dashed var(--line);
  }
  table.summary-table td.item-cell { font-weight: 600; }
  table.summary-table td.num-cell { font-family: 'Courier New', monospace; }

  .grand-total {
    display: flex;
    justify-content: space-between;
    padding-top: 12px;
    margin-top: 4px;
    border-top: 2px solid var(--ink);
    font-weight: 700;
    font-size: 15px;
  }
  .grand-total .val { font-family: 'Courier New', monospace; }

  .cat-subtotal {
    display: flex;
    justify-content: space-between;
    padding: 6px 10px;
    margin: 6px 0 18px;
    background: var(--paper-dark);
    border-radius: 0 6px 6px 0;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
  }
  .cat-subtotal .val { font-family: 'Courier New', monospace; }


  .shopping-add-btn {
    width: 100%;
    border: 0;
    border-radius: 8px;
    padding: 12px 14px;
    background: var(--stamp);
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
  }
  .shopping-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .shopping-actions button {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 8px;
    background: var(--white);
    color: var(--ink);
    font-weight: 700;
    cursor: pointer;
  }
  .shopping-actions .primary {
    background: var(--ink);
    color: var(--white);
    border-color: var(--ink);
  }
  .week-picker {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }
  .week-picker button {
    border:1px solid var(--line);
    background:var(--white);
    border-radius:7px;
    width:38px;
    height:34px;
    font-size:20px;
    cursor:pointer;
  }
  .week-picker .label {
    flex:1;
    text-align:center;
    font-weight:800;
    font-size:13px;
  }
  .shopping-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:10px 0;
    border-bottom:1px dashed var(--line);
  }
  .shopping-row:last-child { border-bottom:0; }
  .shopping-row .info { display:flex; align-items:center; min-width:0; }
  .shopping-row .text { min-width:0; }
  .shopping-row .item-name { font-weight:700; font-size:13px; }
  .shopping-row .meta { font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .shopping-row .qty { font-family:'Courier New',monospace; font-weight:800; white-space:nowrap; }
  .shopping-row .remove-list {
    border:0; background:transparent; color:var(--ink-soft); padding:5px; font-size:15px; cursor:pointer;
  }
  .shopping-empty { text-align:center; padding:18px 8px; color:var(--ink-soft); font-size:12px; }

  .footer-note {
    text-align: center;
    font-size: 10.5px;
    color: var(--ink-soft);
    padding: 10px 24px 0;
    font-family: 'Courier New', monospace;
  }

  .loading { text-align: center; padding: 30px; color: var(--ink-soft); font-size: 13px; }

  /* ===== Subtle app animations ===== */
  @keyframes appReveal {
    from { opacity: 0; transform: translateY(14px) scale(.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes headerReveal {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes cardReveal {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn {
    0% { transform: scale(.92); opacity: 0; }
    70% { transform: scale(1.03); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  #app { animation: appReveal .55s cubic-bezier(.22,1,.36,1) both; }
  .receipt-head { animation: headerReveal .5s ease-out .05s both; }
  .restaurant-toggle, .tabs { animation: cardReveal .45s ease-out .12s both; }
  .card { animation: cardReveal .45s cubic-bezier(.22,1,.36,1) both; }
  .cat-pill, .add-btn, .shopping-add-btn { transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease; }
  button:active { transform: scale(.97); }
  .cat-pill:active, .add-btn:active, .shopping-add-btn:active { transform: scale(.98); }
  .log-entry, .shopping-row, .summary-cat-header, .grand-total { animation: cardReveal .3s ease-out both; }
  .tabs button, .restaurant-toggle button { transition: background .18s ease, color .18s ease, transform .12s ease; }
  .tabs button.active, .restaurant-toggle button.active { animation: popIn .22s ease-out both; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }


  .view-animated { animation: viewSwap .28s ease-out both; }
  @keyframes viewSwap {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
  }

</style>

<div id="app">
  <div class="receipt-head">
    <div class="eyebrow">★ Stock Tracker ★</div>
    <h1>El Gordo</h1>
    <div class="sub">purchase log &amp; monthly recap</div>
  </div>

  <div class="restaurant-toggle">
    <button id="btn-union" class="active">UNION NJ</button>
    <button id="btn-jersey">JERSEY CITY</button>
  </div>

  <div class="tabs">
    <button id="tab-log" class="active">Log purchase</button>
    <button id="tab-list">Shopping list</button>
    <button id="tab-summary">Monthly recap</button>
  </div>

  <div id="view-log" class="view-animated"></div>
  <div id="view-list" class="view-animated" style="display:none;"></div>
  <div id="view-summary" class="view-animated" style="display:none;"></div>

  <div class="footer-note">shared online • changes sync between phones</div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'el_gordo_purchases_v1';
  const CATEGORIES = ['Kitchen', 'Back', 'Front'];
  const CAT_COLOR = { Kitchen: '#A15A34', Back: '#3D6B8C', Front: '#4F7A4F' };
  const RESTAURANTS = { union: 'El Gordo Union NJ', jersey: 'El Gordo Jersey City' };

  let state = {
    restaurant: 'union',
    tab: 'log',
    listCategory: 'Kitchen',
    listWeek: getMondayISO(new Date()),
    shoppingItems: [],
    category: 'Kitchen',
    entries: [],
    summaryMonth: new Date().toISOString().slice(0, 7), // YYYY-MM
    loaded: false
  };

  const $ = (id) => document.getElementById(id);

  // ===== Online shared database (Supabase) =====
  // Replace these two values with the Project URL and Publishable key from Supabase.
  const SUPABASE_URL = 'https://suidbjuzmuorfatgjppu.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_AnO5X-rlrLVlBHcIxsiH7A_dlikRUQI';
  const supabaseClient = (window.supabase && !SUPABASE_URL.startsWith('PASTE_'))
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
    : null;

  async function loadEntries() {
    if (!supabaseClient) {
      state.entries = [];
      state.loaded = true;
      return;
    }
    try {
      const { data, error } = await supabaseClient
        .from('purchases')
        .select('*')
        .order('date', { ascending: false })
        .order('created_at', { ascending: false });
      if (error) throw error;
      state.entries = (data || []).map(e => ({
        id: e.id, restaurant: e.restaurant, category: e.category,
        item: e.item, qty: Number(e.qty), unit: e.unit || '',
        price: Number(e.price), date: e.date
      }));
    } catch (e) {
      console.error('Database load error', e);
      alert('Could not load shared stock data. Check your Supabase setup.');
      state.entries = [];
    }
    state.loaded = true;
  }

  async function saveEntries() {
    // Kept for compatibility with the original app. Individual writes happen below.
    return true;
  }

  function startRealtime() {
    if (!supabaseClient) return;
    supabaseClient.channel('purchases-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'purchases' }, async () => {
        await loadEntries();
        renderAll();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'shopping_list' }, async () => {
        if (state.tab === 'list') await renderListView();
      })
      .subscribe();
  }

  function fmtMoney(n) {
    return '$' + (Math.round(n * 100) / 100).toFixed(2);
  }
  function fmtQty(n) {
    return (Math.round(n * 100) / 100).toString();
  }
  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }
  function monthLabel(ym) {
    const [y, m] = ym.split('-').map(Number);
    const d = new Date(y, m - 1, 1);
    return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  }
  function shiftMonth(ym, delta) {
    let [y, m] = ym.split('-').map(Number);
    m += delta;
    if (m < 1) { m = 12; y -= 1; }
    if (m > 12) { m = 1; y += 1; }
    return y + '-' + String(m).padStart(2, '0');
  }

  function renderTabs() {
    $('btn-union').classList.toggle('active', state.restaurant === 'union');
    $('btn-jersey').classList.toggle('active', state.restaurant === 'jersey');
    $('tab-log').classList.toggle('active', state.tab === 'log');
    $('tab-summary').classList.toggle('active', state.tab === 'summary');
    $('view-log').style.display = state.tab === 'log' ? 'block' : 'none';
    $('view-list').style.display = state.tab === 'list' ? 'block' : 'none';
    $('view-summary').style.display = state.tab === 'summary' ? 'block' : 'none';
  }


  function getMondayISO(date) {
    const d = new Date(date);
    d.setHours(12, 0, 0, 0);
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d.toISOString().slice(0, 10);
  }

  function shiftWeek(iso, delta) {
    const d = new Date(iso + 'T12:00:00');
    d.setDate(d.getDate() + (delta * 7));
    return d.toISOString().slice(0, 10);
  }

  function weekLabel(iso) {
    const start = new Date(iso + 'T12:00:00');
    const end = new Date(start);
    end.setDate(end.getDate() + 6);
    const opts = { month: 'short', day: 'numeric' };
    return `${start.toLocaleDateString('en-US', opts)} – ${end.toLocaleDateString('en-US', { ...opts, year: 'numeric' })}`;
  }

  async function loadShoppingItems() {
    if (!supabaseClient) { state.shoppingItems = []; return; }
    try {
      const { data, error } = await supabaseClient
        .from('shopping_list')
        .select('*')
        .eq('restaurant', state.restaurant)
        .eq('week_start', state.listWeek)
        .order('category')
        .order('created_at');
      if (error) throw error;
      state.shoppingItems = data || [];
    } catch (e) {
      console.error('Shopping list load error', e);
      state.shoppingItems = [];
    }
  }

  async function addShoppingItem() {
    const item = $('s-item').value.trim();
    const qty = parseFloat($('s-qty').value);
    const unit = $('s-unit').value.trim();
    if (!item || isNaN(qty) || qty <= 0) {
      alert('Please enter an item and quantity.');
      return;
    }
    const btn = $('s-add');
    btn.disabled = true;
    btn.textContent = 'Adding...';
    const { error } = await supabaseClient.from('shopping_list').insert({
      restaurant: state.restaurant,
      category: state.listCategory,
      item,
      qty,
      unit,
      week_start: state.listWeek
    });
    if (error) {
      console.error(error);
      alert('Could not add this item. Make sure the shopping_list table has been created.');
    } else {
      await loadShoppingItems();
      renderListView();
    }
    btn.disabled = false;
    btn.textContent = 'Add to shopping list';
  }

  async function removeShoppingItem(id) {
    if (!confirm('Remove this item from the shopping list?')) return;
    const { error } = await supabaseClient.from('shopping_list').delete().eq('id', id);
    if (error) {
      console.error(error);
      alert('Could not remove this item.');
      return;
    }
    await loadShoppingItems();
    renderListView();
  }

  function buildShoppingMessage() {
    const grouped = {};
    state.shoppingItems.forEach(x => {
      (grouped[x.category] ||= []).push(x);
    });
    let out = `EL GORDO — SHOPPING LIST\n${RESTAURANTS[state.restaurant]}\nWeek: ${weekLabel(state.listWeek)}\n`;
    CATEGORIES.forEach(cat => {
      const rows = grouped[cat] || [];
      if (!rows.length) return;
      out += `\n${cat.toUpperCase()}\n`;
      rows.forEach(x => { out += `• ${x.item} — ${fmtQty(Number(x.qty))}${x.unit ? ' ' + x.unit : ''}\n`; });
    });
    return out;
  }

  async function shareShoppingList() {
    if (!state.shoppingItems.length) {
      alert('The shopping list is empty.');
      return;
    }
    const message = buildShoppingMessage();
    if (navigator.share) {
      try { await navigator.share({ title: 'El Gordo Shopping List', text: message }); }
      catch (e) { if (e && e.name !== 'AbortError') console.error(e); }
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(message);
      alert('Shopping list copied. You can paste it into Messages or WhatsApp.');
    } else {
      prompt('Copy this shopping list:', message);
    }
  }

  async function renderListView() {
    const el = $('view-list');
    await loadShoppingItems();
    const grouped = {};
    state.shoppingItems.forEach(x => (grouped[x.category] ||= []).push(x));

    el.innerHTML = `
      <div class="card">
        <div class="week-picker">
          <button id="s-prev">‹</button>
          <div class="label">WEEK OF ${weekLabel(state.listWeek).toUpperCase()}</div>
          <button id="s-next">›</button>
        </div>
        <div class="cat-pills">
          ${CATEGORIES.map(c => `<div class="cat-pill ${c === state.listCategory ? 'active' : ''}" data-list-cat="${c}">${c}</div>`).join('')}
        </div>
        <div class="field">
          <label>Item to buy</label>
          <input type="text" id="s-item" placeholder="e.g. Whole chicken">
        </div>
        <div class="row-2">
          <div class="field">
            <label>Quantity</label>
            <input type="number" id="s-qty" placeholder="0" inputmode="decimal">
          </div>
          <div class="field">
            <label>Unit</label>
            <input type="text" id="s-unit" placeholder="kg, pack...">
          </div>
        </div>
        <button class="shopping-add-btn" id="s-add">Add to shopping list</button>
        <div class="shopping-actions">
          <button class="primary" id="s-share">📤 Share list</button>
        </div>
      </div>

      <div class="section-label">To buy — ${RESTAURANTS[state.restaurant]}</div>
      <div class="card" style="padding: 6px 16px;">
        ${state.shoppingItems.length === 0
          ? '<div class="shopping-empty">No items on this week’s shopping list.</div>'
          : CATEGORIES.map(cat => {
              const rows = grouped[cat] || [];
              if (!rows.length) return '';
              return `<div class="summary-cat-header">
                <div class="bar" style="background:${CAT_COLOR[cat]}"></div><span>${cat}</span>
              </div>` + rows.map(x => `
                <div class="shopping-row">
                  <div class="info">
                    <span class="dot" style="background:${CAT_COLOR[cat]}"></span>
                    <div class="text">
                      <div class="item-name">${escapeHtml(x.item)}</div>
                      <div class="meta">${RESTAURANTS[state.restaurant]} · ${weekLabel(state.listWeek)}</div>
                    </div>
                  </div>
                  <div style="display:flex;align-items:center;">
                    <div class="qty">${fmtQty(Number(x.qty))} ${escapeHtml(x.unit || '')}</div>
                    <button class="remove-list" data-list-del="${x.id}">✕</button>
                  </div>
                </div>
              `).join('');
            }).join('')}
      </div>
    `;

    el.querySelectorAll('[data-list-cat]').forEach(p => p.addEventListener('click', () => {
      state.listCategory = p.getAttribute('data-list-cat');
      renderListView();
    }));
    $('s-add').addEventListener('click', addShoppingItem);
    $('s-share').addEventListener('click', shareShoppingList);
    $('s-prev').addEventListener('click', async () => { state.listWeek = shiftWeek(state.listWeek, -1); await renderListView(); });
    $('s-next').addEventListener('click', async () => { state.listWeek = shiftWeek(state.listWeek, 1); await renderListView(); });
    el.querySelectorAll('[data-list-del]').forEach(btn => btn.addEventListener('click', () => removeShoppingItem(btn.getAttribute('data-list-del'))));
  }

  function renderLogView() {
    const el = $('view-log');
    const myEntries = state.entries
      .filter(e => e.restaurant === state.restaurant)
      .sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));

    el.innerHTML = `
      <div class="card">
        <div class="cat-pills">
          ${CATEGORIES.map(c => `<div class="cat-pill ${c === state.category ? 'active' : ''}" data-cat="${c}">${c}</div>`).join('')}
        </div>
        <div class="field">
          <label>Item</label>
          <input type="text" id="f-item" placeholder="e.g. Whole chicken">
        </div>
        <div class="row-2">
          <div class="field">
            <label>Quantity</label>
            <input type="number" id="f-qty" placeholder="0" inputmode="decimal">
          </div>
          <div class="field">
            <label>Unit</label>
            <input type="text" id="f-unit" placeholder="kg, pack...">
          </div>
        </div>
        <div class="row-2">
          <div class="field">
            <label>Unit price ($)</label>
            <input type="number" id="f-price" placeholder="0.00" inputmode="decimal">
          </div>
          <div class="field">
            <label>Date</label>
            <input type="date" id="f-date" value="${todayISO()}">
          </div>
        </div>
        <button class="add-btn" id="f-add">Add to log</button>
      </div>

      <div class="section-label">Recent — ${RESTAURANTS[state.restaurant]}</div>
      <div class="card" style="padding: 6px 16px;">
        ${myEntries.length === 0
          ? '<div class="empty-note">No purchases logged yet for this restaurant.</div>'
          : myEntries.slice(0, 40).map(e => `
            <div class="log-entry" data-id="${e.id}">
              <div class="info">
                <span class="dot" style="background:${CAT_COLOR[e.category]}"></span>
                <div class="text">
                  <div class="item-name">${escapeHtml(e.item)}</div>
                  <div class="meta">${e.date} · ${fmtQty(e.qty)} ${escapeHtml(e.unit)} · ${e.category}</div>
                </div>
              </div>
              <div style="display:flex; align-items:center;">
                <div class="amount">${fmtMoney(e.qty * e.price)}</div>
                <button class="del" data-del="${e.id}">✕</button>
              </div>
            </div>
          `).join('')}
      </div>
    `;

    el.querySelectorAll('.cat-pill').forEach(p => {
      p.addEventListener('click', () => {
        state.category = p.getAttribute('data-cat');
        renderLogView();
      });
    });

    $('f-add').addEventListener('click', onAddEntry);
    el.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', () => onDelete(btn.getAttribute('data-del')));
    });
  }

  async function onAddEntry() {
    const item = $('f-item').value.trim();
    const qty = parseFloat($('f-qty').value);
    const unit = $('f-unit').value.trim();
    const price = parseFloat($('f-price').value);
    const date = $('f-date').value || todayISO();

    if (!item || isNaN(qty) || isNaN(price)) {
      alert('Please fill in at least Item, Quantity and Unit price.');
      return;
    }

    const addBtn = $('f-add');
    addBtn.disabled = true;
    addBtn.textContent = 'Adding...';

    if (!supabaseClient) {
      alert('First connect the app to Supabase (see SETUP.md).');
      addBtn.disabled = false;
      addBtn.textContent = 'Add to log';
      return;
    }
    const { error } = await supabaseClient.from('purchases').insert({
      restaurant: state.restaurant, category: state.category, item, qty, unit, price, date
    });
    if (error) {
      console.error(error);
      alert('Could not save this purchase.');
      addBtn.disabled = false;
      addBtn.textContent = 'Add to log';
      return;
    }
    await loadEntries();
    renderLogView();
  }

  async function onDelete(id) {
    if (!supabaseClient) return;
    if (!confirm('Delete this purchase?')) return;
    const { error } = await supabaseClient.from('purchases').delete().eq('id', id);
    if (error) {
      console.error(error);
      alert('Could not delete this purchase.');
      return;
    }
    await loadEntries();
    renderLogView();
    if (state.tab === 'summary') renderSummaryView();
  }

  function renderSummaryView() {
    const el = $('view-summary');
    const monthEntries = state.entries.filter(e =>
      e.restaurant === state.restaurant && e.date.slice(0, 7) === state.summaryMonth
    );

    let grandTotal = 0;
    const blocks = CATEGORIES.map(cat => {
      const items = {};
      monthEntries.filter(e => e.category === cat).forEach(e => {
        if (!items[e.item]) items[e.item] = { qty: 0, amount: 0 };
        items[e.item].qty += e.qty;
        items[e.item].amount += e.qty * e.price;
      });
      const rows = Object.keys(items).sort();
      let catTotal = 0;
      rows.forEach(r => { catTotal += items[r].amount; });
      grandTotal += catTotal;

      return `
        <div class="summary-cat-header">
          <div class="bar" style="background:${CAT_COLOR[cat]}"></div>
          <span>${cat}</span>
        </div>
        ${rows.length === 0
          ? '<div class="empty-note" style="padding:8px 0 16px;">No items this month.</div>'
          : `<table class="summary-table">
              <thead><tr><th>Item</th><th>Qty</th><th>Amount</th></tr></thead>
              <tbody>
                ${rows.map(r => `
                  <tr>
                    <td class="item-cell">${escapeHtml(r)}</td>
                    <td class="num-cell">${fmtQty(items[r].qty)}</td>
                    <td class="num-cell">${fmtMoney(items[r].amount)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
            <div class="cat-subtotal" style="border-left: 3px solid ${CAT_COLOR[cat]};">
              <span>${cat} total</span>
              <span class="val">${fmtMoney(catTotal)}</span>
            </div>`}
      `;
    }).join('');

    el.innerHTML = `
      <div class="card">
        <div class="month-picker">
          <button id="m-prev">‹</button>
          <div class="label">${monthLabel(state.summaryMonth).toUpperCase()}</div>
          <button id="m-next">›</button>
        </div>
        <div style="font-size:11px; color:var(--ink-soft); text-align:center; margin-bottom:4px;">
          ${RESTAURANTS[state.restaurant]}
        </div>
        <button class="shopping-add-btn" id="export-excel" style="margin-top:10px;">📊 Export Excel</button>
        ${blocks}
        <div class="grand-total">
          <span>Total (Kitchen + Back + Front)</span>
          <span class="val">${fmtMoney(grandTotal)}</span>
        </div>
      </div>
    `;

    $('m-prev').addEventListener('click', () => {
      state.summaryMonth = shiftMonth(state.summaryMonth, -1);
      renderSummaryView();
    });
    $('m-next').addEventListener('click', () => {
      state.summaryMonth = shiftMonth(state.summaryMonth, 1);
      renderSummaryView();
    });
    $('export-excel').addEventListener('click', exportMonthlyExcel);
  }

  function exportMonthlyExcel() {
    if (!window.XLSX) {
      alert('Excel export is not available right now. Please try again.');
      return;
    }
    const monthEntries = state.entries.filter(e =>
      e.restaurant === state.restaurant && e.date.slice(0, 7) === state.summaryMonth
    );
    if (!monthEntries.length) {
      alert('There are no purchases for this month to export.');
      return;
    }

    const rows = monthEntries.map(e => ({
      Date: e.date,
      Restaurant: RESTAURANTS[e.restaurant],
      Category: e.category,
      Item: e.item,
      Quantity: Number(e.qty),
      Unit: e.unit || '',
      'Unit Price ($)': Number(e.price),
      'Total ($)': Number(e.qty) * Number(e.price)
    }));

    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [
      { wch: 12 }, { wch: 24 }, { wch: 12 }, { wch: 28 },
      { wch: 10 }, { wch: 12 }, { wch: 16 }, { wch: 14 }
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Purchases');

    const summary = [];
    for (const cat of CATEGORIES) {
      const total = monthEntries
        .filter(e => e.category === cat)
        .reduce((sum, e) => sum + Number(e.qty) * Number(e.price), 0);
      summary.push({ Category: cat, 'Total ($)': total });
    }
    summary.push({
      Category: 'TOTAL',
      'Total ($)': monthEntries.reduce((sum, e) => sum + Number(e.qty) * Number(e.price), 0)
    });
    const ws2 = XLSX.utils.json_to_sheet(summary);
    ws2['!cols'] = [{ wch: 16 }, { wch: 14 }];
    XLSX.utils.book_append_sheet(wb, ws2, 'Monthly Summary');

    const fileName = `El-Gordo-${state.restaurant}-${state.summaryMonth}.xlsx`;
    XLSX.writeFile(wb, fileName);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[m]);
  }

  function renderAll() {
    renderTabs();
    renderLogView();
    if (state.tab === 'list') renderListView();
    renderSummaryView();
  }

  $('btn-union').addEventListener('click', () => { state.restaurant = 'union'; renderAll(); });
  $('btn-jersey').addEventListener('click', () => { state.restaurant = 'jersey'; renderAll(); });
  $('tab-log').addEventListener('click', () => { state.tab = 'log'; renderAll(); });
  $('tab-list').addEventListener('click', () => { state.tab = 'list'; renderAll(); });
  $('tab-summary').addEventListener('click', () => { state.tab = 'summary'; renderAll(); });

  (async function init() {
    $('view-log').innerHTML = '<div class="loading">Loading...</div>';
    await loadEntries();
    renderAll();
    startRealtime();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }
  })();
})();
</script>
